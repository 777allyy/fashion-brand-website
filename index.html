
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR — Clothing</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 13px;
    }

    .hero {
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px 8%;
      background: linear-gradient(120deg, #292929, #111);
    }

    .hero p {
      color: #aaa;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(50px, 10vw, 100px);
      line-height: 1;
    }

    .hero a {
      display: inline-block;
      margin-top: 30px;
      background: white;
      color: black;
      padding: 15px 25px;
      text-decoration: none;
      width: fit-content;
      font-weight: bold;
    }

    .products {
      padding: 65px 8%;
    }

    .products h2 {
      font-size: 30px;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product {
      background: #202020;
      padding-bottom: 20px;
    }

    .product img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }

    .product h3,
    .product p {
      margin: 12px;
    }

    .product p {
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #333;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }

      nav a {
        margin-left: 8px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NOIR.</div>
    <nav>
      <a href="#home">HOME</a>
      <a href="#shop">SHOP</a>
      <a href="#about">ABOUT</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <p>NEW COLLECTION — 2026</p>
    <h1>WEAR<br>YOUR<br>IDENTITY.</h1>
    <a href="#shop">EXPLORE COLLECTION</a>
  </section>

  <section class="products" id="shop">
    <h2>THE COLLECTION</h2>

    <div class="grid">

      <div class="product">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600" alt="White T-shirt">
        <h3>Essential Tee</h3>
        <p>Rs. 1,800</p>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600" alt="Jacket">
        <h3>Street Jacket</h3>
        <p>Rs. 3,500</p>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=600" alt="Black shirt">
        <h3>Classic Shirt</h3>
        <p>Rs. 2,000</p>
      </div>

    </div>
  </section>

  <footer id="about">
    <p>NOIR. — MADE FOR EVERYDAY EXPRESSION.</p>
    <p>© 2026 NOIR. All rights reserved.</p>
  </footer>

</body>
</html>
